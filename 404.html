<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#5b6ee1">
    <title>404 · 页面不存在 | 直播源工具箱</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%235b6ee1'/><text x='32' y='41' font-size='24' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>404</text></svg>">
    <style>
        :root {
            --c1: #667eea; --c2: #764ba2;
            --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--font);
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%);
            color: #fff; overflow-x: hidden; position: relative;
        }
        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(135deg, #2b3270 0%, #3b1f54 100%); }
        }
        .bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .bubble { position: absolute; bottom: -80px; border-radius: 50%; background: rgba(255,255,255,.1); animation: rise 12s linear infinite; }
        .card {
            position: relative; z-index: 1; width: min(100%, 560px); text-align: center;
            padding: clamp(28px, 6vw, 48px) clamp(20px, 5vw, 44px);
            border-radius: 24px; background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.18);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,.18);
        }
        .code {
            font-size: clamp(5.5rem, 24vw, 10rem); font-weight: 800; line-height: 1; letter-spacing: -.04em;
            text-shadow: 0 6px 0 rgba(0,0,0,.08); animation: float 3.2s ease-in-out infinite;
        }
        h1 { font-size: clamp(1.15rem, 4.2vw, 1.5rem); font-weight: 600; margin: 18px 0 8px; }
        .desc { opacity: .85; font-size: clamp(.9rem, 3.4vw, 1rem); line-height: 1.7; }
        .path { margin-top: 10px; font-family: ui-monospace, Consolas, monospace; font-size: .82rem; opacity: .7; overflow-wrap: anywhere; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 46px; padding: 0 24px; border-radius: 999px;
            font-size: 1rem; font-weight: 600; text-decoration: none; cursor: pointer;
            border: 2px solid #fff; transition: transform .2s, background .2s, color .2s;
            font-family: inherit;
        }
        .btn-primary { background: #fff; color: #4b4fb3; }
        .btn-ghost { background: rgba(255,255,255,.12); color: #fff; }
        .btn:hover { transform: translateY(-2px); }
        .btn-ghost:hover { background: rgba(255,255,255,.22); }
        .btn:focus-visible { outline: 3px solid #ffd54f; outline-offset: 3px; }
        .links { margin-top: 22px; font-size: .9rem; opacity: .9; }
        .links a { color: #fff; margin: 0 8px; text-underline-offset: 3px; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes rise { 0% { transform: translateY(0) scale(.4); opacity: 0; } 15% { opacity: .35; } 100% { transform: translateY(-120vh) scale(1); opacity: 0; } }
        @media (max-width: 420px) {
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .code, .bubble { animation: none; }
            .bubble { display: none; }
            .btn { transition: none; }
        }
    </style>
</head>
<body>
    <div class="bg" aria-hidden="true">
        <span class="bubble" style="left:8%;width:40px;height:40px;animation-delay:0s"></span>
        <span class="bubble" style="left:28%;width:64px;height:64px;animation-delay:3s"></span>
        <span class="bubble" style="left:55%;width:28px;height:28px;animation-delay:6s"></span>
        <span class="bubble" style="left:78%;width:52px;height:52px;animation-delay:1.5s"></span>
        <span class="bubble" style="left:92%;width:34px;height:34px;animation-delay:8s"></span>
    </div>

    <main class="card">
        <div class="code" aria-hidden="true">404</div>
        <h1>页面不存在</h1>
        <p class="desc">您访问的页面可能已被移动、删除，或地址输入有误。</p>
        <p class="path" id="path"></p>
        <div class="actions">
            <a href="/" class="btn btn-primary">返回工具箱</a>
            <button type="button" class="btn btn-ghost" id="back">返回上一页</button>
        </div>
        <p class="links">
            <a href="/player/">播放器</a>·
            <a href="/txt2m3u/">格式转换</a>·
            <a href="/val/">有效性验证</a>
        </p>
    </main>

    <script>
        (function () {
            var p = document.getElementById('path');
            try { p.textContent = decodeURIComponent(location.pathname); } catch (e) { p.textContent = location.pathname; }
            var back = document.getElementById('back');
            if (history.length <= 1 || !document.referrer) back.hidden = true;
            back.addEventListener('click', function () { history.back(); });
        })();
    </script>
</body>
</html>
